# BACKGROUND SETTINGS
background {
    monitor =
    path = /home/rish/wallpaper/forest-landscape.jpg
    blur_passes = 0.5
    contrast = 0.2
    brightness = 1
    vibrancy = 1
    vibrancy_darkness = 0.2
    region = right_half
}

# GENERAL LOCK SCREEN SETTINGS
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# DATE LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d ")"
    color = rgba(37,43,75,1)
    font_size = 50
    font_family = DepartureMono Nerd Font
    position = 80, -270
    halign = left
    valign = center
}

# TIME LABEL
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(255, 255, 255, 0.7)  # Black
    font_size = 180
    font_family = FantasqueSansM Nerd Font
    position = 80, -120
    halign = left
    valign = center
}


# DESKTOP ENVIRONMENT LOGO
image {
    monitor =
    path = /home/rish/.config/hypr/assets/logo.png
    size = 75
    border_size = 0
    border_color = $foreground
    position = -50, 50
    halign = right
    valign = bottom
    rounding = 0
}

# CURRENT SONG LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/rish/.config/hypr/scripts/whatsong.sh)"
    font_size = 20
    font_family = JetBrains Mono
    color = rgba(48, 44, 62, 1)
    position = 80, 180
    halign = left
    valign = bottom
}

# USERNAME LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/rish/.config/hypr/scripts/whoami.sh)"
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -10
    halign = center
    valign = top
}

# BATTERY STATUS LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/rish/.config/hypr/scripts/battery.sh)"
    color = $foreground
    font_size = 24
    font_family = JetBrains Mono
    position = -90, -10
    halign = right
    valign = top
}

# NETWORK STATUS LABEL
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/rish/.config/hypr/scripts/network-status.sh)"
    color = $foreground
    font_size = 24
    font_family = JetBrains Mono
    position = -20, -10
    halign = right
    valign = top
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255,255,255,1)
    inner_color = rgba(105,109,151,0.7)
    font_color = #23535f
    fade_on_empty = true
    rounding = 0.05
    border_size = 3 
    border_color = #23535f
    check_color = rgb(204, 136, 34)
    placeholder_text = 
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}
